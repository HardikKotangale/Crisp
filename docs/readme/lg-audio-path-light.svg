<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 408" width="960" height="408" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">How the LG volume fix works</title><desc id="d">DDC commands from the Mac are blocked at the USB-C to HDMI adapter, which only answers with EDID, so the monitor never receives them. Crisp instead taps audio going to the LG output, scales it, and sends it on through the adapter to the LG speakers.</desc>
<rect width="960" height="408" rx="12" fill="#fcfcfb" stroke="#d8d6cf"/>
<text x="32" y="44" fill="#0b0b0b" font-size="21" font-weight="700" text-anchor="start">Why DDC failed, and how the sound gets lowered instead</text>
<text x="32" y="70" fill="#52514e" font-size="14.5" font-weight="400" text-anchor="start">Same cable, two different layers. Commands never reach the monitor, so the Mac scales the audio first.</text>
<text x="32" y="112" fill="#52514e" font-size="13" font-weight="700" text-anchor="start">BEFORE: DDC, the way volume normally works</text>
<rect x="32" y="126" width="190" height="86" rx="10" fill="#f3f2ee" stroke="#d8d6cf"/>
<text x="127" y="162" fill="#0b0b0b" font-size="16" font-weight="700" text-anchor="middle">MacBook Pro</text>
<text x="127" y="186" fill="#52514e" font-size="13" font-weight="400" text-anchor="middle">"Volume down" command</text>
<rect x="358" y="126" width="230" height="86" rx="10" fill="#fbe9e8" stroke="#d03b3b"/>
<text x="473" y="159" fill="#0b0b0b" font-size="16" font-weight="700" text-anchor="middle">USB-C to HDMI adapter</text>
<text x="473" y="182" fill="#52514e" font-size="13" font-weight="400" text-anchor="middle">Answers only with EDID</text>
<text x="473" y="200" fill="#52514e" font-size="13" font-weight="400" text-anchor="middle">2-byte limit, DDC needs about 5</text>
<rect x="724" y="126" width="204" height="86" rx="10" fill="#f3f2ee" stroke="#d8d6cf"/>
<text x="826" y="162" fill="#0b0b0b" font-size="16" font-weight="700" text-anchor="middle">LG ULTRAWIDE</text>
<text x="826" y="186" fill="#52514e" font-size="13" font-weight="400" text-anchor="middle">Never hears the command</text>
<line x1="222" y1="169" x2="349" y2="169" stroke="#6f6e69" stroke-width="2.5"/><path d="M358 169 l-11 -6 v12 z" fill="#6f6e69"/>
<line x1="588" y1="169" x2="715" y2="169" stroke="#d03b3b" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M724 169 l-11 -6 v12 z" fill="#d03b3b"/>
<circle cx="656" cy="169" r="10" fill="#d03b3b"/><path d="M652 165 l8 8 M660 165 l-8 8" stroke="#fcfcfb" stroke-width="2.4" stroke-linecap="round"/>
<text x="656" y="198" fill="#0b0b0b" font-size="13" font-weight="700" text-anchor="middle">blocked</text>
<text x="32" y="248" fill="#52514e" font-size="13" font-weight="700" text-anchor="start">AFTER: software volume in Crisp</text>
<rect x="32" y="262" width="120" height="86" rx="10" fill="#f3f2ee" stroke="#d8d6cf"/>
<text x="92" y="300" fill="#0b0b0b" font-size="16" font-weight="700" text-anchor="middle">Apps</text>
<text x="92" y="322" fill="#52514e" font-size="13" font-weight="400" text-anchor="middle">Music, video</text>
<rect x="232" y="262" width="250" height="86" rx="10" fill="#e6f0fb" stroke="#2a78d6"/>
<text x="357" y="295" fill="#0b0b0b" font-size="16" font-weight="700" text-anchor="middle">Crisp software volume</text>
<text x="357" y="318" fill="#52514e" font-size="13" font-weight="400" text-anchor="middle">Core Audio tap on this output</text>
<text x="357" y="336" fill="#52514e" font-size="13" font-weight="400" text-anchor="middle">Scales every audio sample</text>
<rect x="562" y="262" width="142" height="86" rx="10" fill="#f3f2ee" stroke="#d8d6cf"/>
<text x="633" y="300" fill="#0b0b0b" font-size="16" font-weight="700" text-anchor="middle">Adapter</text>
<text x="633" y="322" fill="#52514e" font-size="13" font-weight="400" text-anchor="middle">Carries audio fine</text>
<rect x="784" y="262" width="144" height="86" rx="10" fill="#e4f5ee" stroke="#0ca30c"/>
<text x="856" y="300" fill="#0b0b0b" font-size="16" font-weight="700" text-anchor="middle">LG speakers</text>
<text x="856" y="322" fill="#52514e" font-size="13" font-weight="400" text-anchor="middle">Quieter sound</text>
<line x1="152" y1="305" x2="223" y2="305" stroke="#6f6e69" stroke-width="2.5"/><path d="M232 305 l-11 -6 v12 z" fill="#6f6e69"/>
<line x1="482" y1="305" x2="553" y2="305" stroke="#2a78d6" stroke-width="2.5"/><path d="M562 305 l-11 -6 v12 z" fill="#2a78d6"/>
<line x1="704" y1="305" x2="775" y2="305" stroke="#0ca30c" stroke-width="2.5"/><path d="M784 305 l-11 -6 v12 z" fill="#0ca30c"/>
<text x="32" y="386" fill="#52514e" font-size="13.5" font-weight="400" text-anchor="start">Tap off at 100%. Other audio outputs are untouched. If Crisp quits, macOS unmutes by itself. It can only lower the volume.</text>
</svg>
